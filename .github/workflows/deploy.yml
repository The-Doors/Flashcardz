name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push React
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: web
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/{{ steps.owner.outputs.OWNER }}/flashcardz-web:latest
            ghcr.io/{{ steps.owner.outputs.OWNER }}/flashcardz-web:${{ github.sha }}

      - name: Build and push Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: proxy
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-frontend:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-frontend:${{ github.sha }}

      - name: Build and push FastAPI
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-backend:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/my-app
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f