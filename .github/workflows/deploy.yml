name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      owner: ${{ steps.owner.outputs.OWNER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push React
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: web
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-web:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-web:${{ github.sha }}

      - name: Build and push HTTPS proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: proxy
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-frontend:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-frontend:${{ github.sha }}

      - name: Build and push Laravel Octane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-backend:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/flashcardz-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      GHCR_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy production Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.yml,supabase/production/compose.sh,supabase/production/compose.override.yml,supabase/production/setup.sh,supabase/production/.env.example
          target: my-app

      - name: Deploy to Ubuntu VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_OWNER,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -eu
            cd ~/my-app
            # Bootstrap Supabase manually once; regular app releases never upgrade it.
            bash supabase/production/compose.sh config --quiet
            bash supabase/production/compose.sh exec -T db pg_isready -U postgres
            bash supabase/production/compose.sh exec -T auth wget -q -O /dev/null http://127.0.0.1:9999/health
            docker compose config --quiet
            docker compose pull
            docker compose run --rm --no-deps backend php artisan migrate --force --no-interaction
            docker compose up -d --remove-orphans --wait --wait-timeout 120
            curl --fail --silent --show-error --max-time 15 --retry 12 --retry-connrefused --retry-delay 5 https://cardz.cards/up
            curl --fail --silent --show-error --max-time 15 --retry 12 --retry-connrefused --retry-delay 5 https://supabase.cardz.cards/auth/v1/.well-known/jwks.json
            docker image prune -f
