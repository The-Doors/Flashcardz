services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-web:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-storage:/app/storage
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  api-storage:
