x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-cardz.cards}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:-supabase.cardz.cards}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - supabase
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-web:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    restart: unless-stopped
    logging: *logging

  backend:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - default
      - supabase
    logging: *logging
    volumes:
      - api-storage:/app/storage
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER:-the-doors}/flashcardz-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=900", "--no-interaction"]
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(array_any(glob("/proc/[0-9]*/cmdline"), fn($$path) => str_starts_with((string) @file_get_contents($$path), "php\0artisan\0queue:work\0")) ? 0 : 1);'
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - default
      - supabase
    logging: *logging
    volumes:
      - api-storage:/app/storage
    init: true
    stop_grace_period: 16m
    restart: unless-stopped

volumes:
  api-storage:
  caddy-data:
  caddy-config:

networks:
  supabase:
    external: true
    name: flashcardz-supabase
